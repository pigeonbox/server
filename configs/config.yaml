server:
  host: "0.0.0.0"
  port: 12345
  mode: "release"  # 镜像内默认 release(调试日志不打);compose/编排可用 PB_SERVER_MODE=debug 覆盖
  base_url: ""             # 对外可达地址（生成分享链接用）；空=按请求来源逐请求推断（含端口，反代须透传 Host）
  read_timeout: 30
  write_timeout: 30

database:
  driver: "sqlite"
  # SQLite 配置：文件路径或 ":memory:" 表示内存数据库
  db_name: "./data/fileCodeBox.db"

# Redis（可选）：多副本部署必配；单机置空 host 进入内存模式
# （匿名取件会话存进程内 TTL KV，重启丢失；需重启不丢取件码请配 Redis+AOF）
redis:
  host: "localhost"  # 置空 = 单机内存模式（env: PB_REDIS_HOST）
  port: 6379
  password: ""
  db: 0

log:
  level: "info"
  filename: ""
  max_size: 100
  max_backups: 10
  max_age: 30
  compress: true

app:
  name: "PigeonBox"
  version: "1.0.0"
  description: "开箱即用的文件快传系统"
  keywords: "PigeonBox, 文件快递柜, 口令传送箱, 匿名口令分享文本, 文件"
  datapath: "./data"
  production: false

# 上传配置
upload:
  open_upload: true
  upload_size: 10485760      # 10MB
  enable_chunk: true
  chunk_size: 2097152       # 2MB
  require_login: false
  # 文本分享大小上限（字节），默认 222KB（对齐上游）
  text_max_bytes: 227328
  # 扩展名白名单（非空则必须命中，未命中拒绝；空 = 仅黑名单模式）
  # allowed_extensions: [".jpg", ".png", ".pdf", ".zip", ".docx"]
  # 扩展名黑名单（非空则覆盖内置默认；白名单命中也拦截；env: PB_UPLOAD_BLOCKED_EXTENSIONS）
  # blocked_extensions: [".exe", ".bat", ".sh", ".js", ".jar", ".dll"]
  # 魔数校验（拦截改扩展名伪装的可执行文件），默认开
  enable_magic_check: true
  # 过期样式白名单（可裁剪；空 = minute/hour/day/week/month/year/forever 全放行）
  # allowed_expire_styles: ["day", "hour", "forever"]
  # 全局过期时间上限（秒），超过自动钳制到该值；0 = 不限
  max_save_seconds_cap: 0
  # 整文件大小上限（字节），适用于分片/预签名通道；0 = 不限。
  # 注意与 upload_size（单请求体上限）语义不同——分片上传的本义即突破单请求限制
  max_file_size: 0
  # 匿名上传 per-IP 日配额（0 = 不限；env: PB_UPLOAD_ANON_DAILY_COUNT / PB_UPLOAD_ANON_DAILY_BYTES）
  # anonymous_daily_count: 100
  # anonymous_daily_bytes: 1073741824

# 下载配置
download:
  download_timeout: 300     # 5分钟
  require_login: false
  # s3 直下：后端为 s3 时下载 302 到短时效预签名 URL（流量不过服务器）
  # 注意：对象存储桶需配置 CORS 允许站点来源（浏览器直传/直下场景）
  s3_direct_download: false

# 限流配置（路径感知分维度 token bucket；use_redis=true 多实例共享计数）
rate_limit:
  enabled: true
  global_qps: 100
  upload_qps: 10
  download_qps: 50
  login_qps: 5
  burst: 20
  block_seconds: 60         # 触发限流后的封禁时长
  use_redis: false

# 存储配置
# type 支持: local / s3(含MinIO) / oss(阿里云) / cos(腾讯云) / bos(百度云) /
#           ks3(金山云) / obs(华为云) / webdav
# 云厂商均走 S3 兼容协议；endpoint 留空时按 region 自动推导，
# 各厂商配置段字段: region/bucket/access_key/secret_key/endpoint/use_ssl/path_style
storage:
  type: "local"
  storage_path: "./data/uploads"
  # 站点级全局存储配额（字节，0=不限）；全通道统一闸口。env: PB_STORAGE_QUOTA
  quota: 0
  # ── 扩展存储后端（全部可选；与 local/s3/webdav 同级使用 type 切换）──
  # ftp:        { host: "nas.local:21", username: "", password: "", tls: "false", root: "pigeonbox" }
  # sftp:       { host: "nas.local:22", username: "", password: "", private_key: "", host_key: "", root: "pigeonbox" }
  # azureblob:  { account: "", container: "", key: "", sas: "", endpoint: "", root: "pigeonbox" }
  # hdfs:       { endpoint: "http://namenode:9870", user: "", root: "pigeonbox" }
  # onedrive:   { client_id: "", client_secret: "", refresh_token: "", tenant: "common", drive_id: "", root: "pigeonbox" }
  # gcs:        { region: "", bucket: "", access_key: "", secret_key: "", endpoint: "storage.googleapis.com" }（S3 兼容 XML+HMAC）
  # 腾讯云 COS 示例（endpoint 留空 = cos.<region>.myqcloud.com 自动推导）:
  # type: "cos"
  # cos:
  #   region: "ap-guangzhou"
  #   bucket: "mybucket-1250000000"
  #   access_key: "COS_AK"
  #   secret_key: "COS_SK"
  # 阿里云 OSS 示例: type: "oss" + oss: {region: "cn-hangzhou", ...}
  # 百度云 BOS: type: "bos" + bos: {region: "bj", ...}（S3 兼容端点 s3.<region>.bcebos.com）
  # 金山云 KS3: type: "ks3" + ks3: {region: "BEIJING", ...}
  # 华为云 OBS: type: "obs" + obs: {region: "cn-north-4", ...}
  # AWS S3 / MinIO: type: "s3" + s3: {endpoint: "...", bucket: "...", access_key: "...", secret_key: "..."}

# 用户配置
user:
  allow_user_registration: false
  user_upload_size: 52428800    # 50MB
  user_storage_quota: 1073741824 # 1GB
  session_expiry_hours: 168     # 7天
  max_sessions_per_user: 5
  jwt_secret: "PigeonBox2025JWT"

# UI 配置（仅 robots_text 实际消费；主题系统未迁移，实装前不暴露键）
ui:
  # 管理后台入口在公开页脚是否展示（缺省展示；置 false 隐藏入口，/admin 路由始终可达，env: PB_UI_SHOW_ADMIN_ADDR）
  show_admin_addr: true
  # 安全版主题：背景图（http(s) 图片 URL）与主题色（#RRGGBB），serve 时白名单校验
  # background: "https://example.com/bg.jpg"
  # accent_color: "#409eff"
  # /openapi.json 公开开关（默认 true，前端 /api-docs 页依赖）。
  # 生产建议置 false：端点全清单对攻击者是现成侦察地图（env: PB_UI_EXPOSE_OPENAPI=false）
  # expose_openapi: true
  robots_text: |
    User-agent: *
    Disallow: /

# 可观测性（Prometheus 指标）
observability:
  metrics:
    enabled: true
    path: "/metrics"

# 通知（外部 Webhook 渠道）
notify:
  webhook_url: ""           # notify.created 事件 JSON POST；空 = 禁用（PB_WEBHOOK_URL）

# 安全配置
security:
  cors:
    allow_origins: []       # 生产环境填写对外域名，如 ["https://fcb.example.com"]
    allow_credentials: false
    # enable_hsts 三态：未配置 = 生产模式默认开 / 开发默认关；显式设置恒生效
    # enable_hsts: false    # 自签证书等特殊拓扑的逃生开关
  # 可信代理网段（CIDR）。只有直连对端落在网段内才采信 X-Forwarded-For，
  # 反向代理部署必填（如 nginx/traefik 所在网段），否则限流/失败锁定按直连 IP 判定
  # （所有用户共享一个限流桶、误锁）。docker-compose 反代场景通常为
  # ["172.18.0.0/16"]（默认 bridge/compose 网段，按 `docker network inspect` 实际调整）；
  # 完整说明见 deploy/nginx/nginx.conf 头部"部署必读"。
  trusted_proxies: []
  # 取件下载令牌（时间窗 HMAC；取件接口下发，/share/download 强制校验）
  download_token:
    enabled: true
    validity_seconds: 1000
  # 登录/取件失败计数锁定（防爆破；维度 IP+账户/取件码）
  lockout:
    enabled: true
    max_attempts: 10
    window_seconds: 300
    lock_seconds: 600
  # 存储端点 SSRF 防护：默认拒绝 s3/webdav 端点指向私网地址；
  # 局域网 MinIO/WebDAV（飞牛 NAS）部署请改为 true
  ssrf:
    allow_private_networks: false
  # 用户级 API Key（个人访问令牌）认证总开关（env: PB_API_TOKEN_ENABLED）
  api_token:
    enabled: true
    per_key_qps: 20           # 单 Key 独立限流（令牌桶）；0 = 不限
    per_key_burst: 40

# MCP server（AI 客户端集成；POST /api/v1/mcp，管理员 JWT 认证）
mcp:
  enabled: true             # PB_MCP_ENABLED
  # 单文件上传/下载上限（字节；默认 6MB=base64 后约 8MB，低于默认请求体上限；
  # 调大超过请求体上限时须同步调大 upload.max_file_size）。PB_MCP_MAX_FILE_SIZE
  # max_file_size: 6291456

# 内容审核（治理 2026-10-03；默认关闭，词表空恒放行）
moderation:
  enabled: false            # PB_MODERATION_ENABLED
  # 敏感词表（子串匹配、大小写不敏感；PB_MODERATION_BLOCKED_WORDS 逗号分隔）
  # blocked_words: ["词1", "词2"]
  block_action: reject      # reject=直接拒绝(30013) | pending=建分享后置待审进管理端队列

# 管理端运维
admin:
  log_retention_days: 90    # 审计/传输日志保留天数，0=永久（PB_ADMIN_LOG_RETENTION_DAYS）

# ===== 2026-10 能力扩展（P0-P3）=====

# 邮件通知：并入上方 notify: 段（站内信创建后对登记邮箱异步补发；host 空 = 禁用）
#   notify:
#     webhook_url: ""
#     smtp:
#       host: ""              # env: PB_SMTP_HOST
#       port: 465             # 465=隐式 TLS；587/25=STARTTLS（PB_SMTP_PORT）
#       username: ""          # PB_SMTP_USERNAME
#       password: ""          # PB_SMTP_PASSWORD
#       from: ""              # 发件地址，空 = 取 username（PB_SMTP_FROM）

# 文件病毒扫描（clamd INSTREAM；moderation.enabled=true 时生效，文件侧由 ClamAV 接管）
# env: PB_MODERATION_CLAMAV_ENABLED / PB_MODERATION_CLAMAV_ADDR
# moderation:
#   clamav:
#     enabled: false
#     addr: "localhost:3310"
#     timeout_seconds: 60
#     max_scan_bytes: 536870912   # 512MB，超过跳过扫描

# OIDC 单点登录（回调地址 <base_url>/api/v1/user/oidc/callback）
# env: PB_OIDC_ENABLED / PB_OIDC_ISSUER / PB_OIDC_CLIENT_ID / PB_OIDC_CLIENT_SECRET / PB_OIDC_SCOPES
# security:
#   oidc:
#     enabled: false
#     issuer: ""              # 如 https://idp.example.com/realms/fcb
#     client_id: ""
#     client_secret: ""
#     scopes: "openid profile email"

# NAS 本地文件免上传导入（服务器白名单目录内文件直接生成提取码）
# env: PB_LOCAL_IMPORT_ENABLED / PB_LOCAL_IMPORT_ROOTS（逗号分隔）
# upload:
#   local_import:
#     enabled: false
#     roots: []               # 如 ["/volume1/share", "/mnt/nas"]

# P2P 联邦接入（M2；默认关闭。对端注册中心：github.com/pigeonbox/p2p）
# 启用后本站口令分享跨站可达：任一联邦节点录码即可解析到本站直连下载，
# 注册中心不落盘、不见明文；取件校验始终在本站完成（零跨节点信任）。
# env: PB_FEDERATION_ENABLED / PB_FEDERATION_REGISTRY_URL /
#      PB_FEDERATION_PUBLIC_URL / PB_FEDERATION_NODE_KEY_PATH /
#      PB_FEDERATION_MIN_ENTROPY
# federation:
#   enabled: false
#   registry_url: ""         # 联邦注册中心基址，如 http://p2p:12346；逗号分隔可配主备
#   public_url: ""           # 本站对外可达地址（一般与 server.base_url 一致）
#   node_key_path: "data/federation.key"  # 节点身份密钥(首次启动自动生成)
#   announce_min_entropy_bits: 40         # 口令公告熵门槛(低熵码不出站)

# ===== 部署模式（多副本拆分，2026-10-06）=====
# standalone(默认,单进程全功能) | public(公开面副本,可多实例) | admin(管理面单实例)
# public/admin 硬约束：database.driver 必须为 mysql/postgresql；Redis 必配
# （配置变更广播依赖）；federation 自动降级关闭（多副本语义未定义）。
# env 注入: PB_DEPLOY_MODE（覆盖 deployment.mode）；详见 hub 仓 docs/specs/2026-10-06-multi-replica-deployment-modes.md
# deployment:
#   mode: standalone
