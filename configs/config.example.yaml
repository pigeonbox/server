# PigeonBox 配置示例（脱敏模板）
#
# 所有敏感配置（jwt_secret、数据库密码、Redis 密码）请通过环境变量注入，
# 不要把真实密钥写入配置文件。环境变量优先级高于本文件。
# 详见 docs/ENVIRONMENT_VARIABLES.md
#
# 启动方式：
#   ./server                                    # 默认读 configs/config.yaml
#   ./server --config /path/to/config.yaml      # 指定配置文件
#   CONFIG_PATH=/path/to/config.yaml ./server   # 或用环境变量

server:
  host: "0.0.0.0"
  port: 12345              # env: PB_SERVER_PORT / PORT
  mode: "debug"            # debug | release | test
  base_url: ""             # 对外可访问地址，如 https://your-domain.com（生成分享链接用）
  read_timeout: 30         # 秒
  write_timeout: 30        # 秒

database:
  driver: "sqlite"         # sqlite | mysql | postgres  (env: PB_DATABASE_DRIVER / DATABASE_TYPE)
  db_name: "./data/fileCodeBox.db"
  # MySQL/Postgres 专用：
  host: "localhost"        # env: PB_DATABASE_HOST / DATABASE_HOST
  port: 3306               # env: PB_DATABASE_PORT / DATABASE_PORT
  user: "root"             # env: PB_DATABASE_USER / DATABASE_USER
  password: ""             # env: PB_DATABASE_PASSWORD / DATABASE_PASS  ⚠️ 生产请用 env 注入

# Redis（可选）：多副本部署必配（配置广播与跨实例状态共享依赖）；
# 单机置空 host 进入内存模式——匿名取件会话存进程内 TTL KV，
# 全功能可用（重启丢失、不跨副本共享；需要重启不丢取件码请配 Redis+AOF）
redis:
  host: "localhost"        # env: PB_REDIS_HOST / REDIS_HOST；置空 = 单机内存模式
  port: 6379               # env: PB_REDIS_PORT / REDIS_PORT
  password: ""             # env: PB_REDIS_PASSWORD / REDIS_PASSWORD  ⚠️ 生产请用 env 注入
  db: 0

log:
  level: "info"            # debug | info | warn | error
  filename: ""             # 空=仅输出到 stdout
  max_size: 100            # MB
  max_backups: 10
  max_age: 30              # 天
  compress: true

app:
  name: "PigeonBox"
  version: "1.0.0"
  description: "开箱即用的文件快传系统"
  datapath: "./data"       # env: PB_DATA_PATH / DATA_PATH
  production: false        # env: PB_PRODUCTION / PRODUCTION（true 时强制校验 secret）

upload:
  # 文本分享大小上限（字节），默认 222KB；白名单/魔数见下
  text_max_bytes: 227328
  # allowed_extensions: [".jpg", ".png", ".pdf", ".zip"]
  # blocked_extensions: [".exe", ".bat", ".sh", ".js", ".jar", ".dll"]  # 非空覆盖内置默认；env: PB_UPLOAD_BLOCKED_EXTENSIONS
  enable_magic_check: true
  open_upload: true        # env: PB_OPEN_UPLOAD / OPEN_UPLOAD
  upload_size: 10485760    # 10MB；env: PB_UPLOAD_SIZE / UPLOAD_SIZE
  enable_chunk: true
  chunk_size: 2097152      # 2MB
  # max_save_seconds_cap: 0             # 全局过期上限（秒），超过自动钳制；0 = 不限
  # 匿名上传 per-IP 日配额（0 = 不限；env: PB_UPLOAD_ANON_DAILY_COUNT / PB_UPLOAD_ANON_DAILY_BYTES）
  # anonymous_daily_count: 100
  # anonymous_daily_bytes: 1073741824
  require_login: false

download:
  download_timeout: 300    # 秒
  require_login: false
  # s3 直下：后端为 s3 时下载 302 到短时效预签名 URL（流量不过服务器）
  # 注意：对象存储桶需配置 CORS 允许站点来源（浏览器直传/直下场景）
  s3_direct_download: false

storage:
  type: "local"            # local | s3 | webdav
  storage_path: "./data/uploads"
  # 站点级全局存储配额（字节，0=不限）；全通道统一闸口。env: PB_STORAGE_QUOTA
  quota: 0
  # ── 扩展存储后端（全部可选；与 local/s3/webdav 同级使用 type 切换）──
  # ftp:        { host: "nas.local:21", username: "", password: "", tls: "false", root: "pigeonbox" }
  # sftp:       { host: "nas.local:22", username: "", password: "", private_key: "", host_key: "", root: "pigeonbox" }
  # azureblob:  { account: "", container: "", key: "", sas: "", endpoint: "", root: "pigeonbox" }
  # hdfs:       { endpoint: "http://namenode:9870", user: "", root: "pigeonbox" }
  # onedrive:   { client_id: "", client_secret: "", refresh_token: "", tenant: "common", drive_id: "", root: "pigeonbox" }
  # gcs:        { region: "", bucket: "", access_key: "", secret_key: "", endpoint: "storage.googleapis.com" }（S3 兼容 XML+HMAC）
  # S3 兼容对象存储（阿里云 OSS / 腾讯云 COS / AWS S3 / MinIO 等）
  # s3:
  #   endpoint: "https://s3.amazonaws.com"
  #   region: "us-east-1"
  #   bucket: "my-bucket"
  #   access_key: ""        # ⚠️ 生产请用 env 注入
  #   secret_key: ""        # ⚠️ 生产请用 env 注入
  #   use_ssl: true
  #   path_style: false
  # WebDAV（坚果云 / Nextcloud 等）
  # webdav:
  #   endpoint: "https://dav.example.com"
  #   username: ""
  #   password: ""          # ⚠️ 生产请用 env 注入

user:
  allow_user_registration: false
  # 单次发送**总量**上限（字节，0=不限）——登录用户一次发送的合计体积上限；
  # 用户级 max_upload_size > 0 时以用户级为准。
  # ⚠️ 与 upload.max_file_size（单文件上限）是两个不同的闸；
  # ⚠️ 总量上限应 >= 单文件上限，否则大文件永远传不上去。
  # 2026-10-30：出厂默认由 50MB 改为 0（不限）。
  user_upload_size: 0
  user_storage_quota: 1073741824 # 1GB
  session_expiry_hours: 168      # 7 天
  max_sessions_per_user: 5
  jwt_secret: "CHANGE_ME_TO_A_SECURE_RANDOM_STRING"  # ⚠️ 生产必须改！env: PB_JWT_SECRET / JWT_SECRET

ui:
  # 管理后台入口在公开页脚是否展示（缺省展示；置 false 隐藏入口，/admin 路由始终可达，env: PB_UI_SHOW_ADMIN_ADDR）
  show_admin_addr: true
  # 安全版主题：背景图（http(s) 图片 URL）与主题色（#RRGGBB），serve 时白名单校验
  # background: "https://example.com/bg.jpg"
  # accent_color: "#409eff"
  # /openapi.json 公开开关（默认 true，前端 /api-docs 页依赖）。
  # 生产建议置 false：端点全清单对攻击者是现成侦察地图（env: PB_UI_EXPOSE_OPENAPI=false）
  # expose_openapi: true
  robots_text: |
    User-agent: *
    Disallow: /

# 可观测性（Prometheus 指标；分布式追踪见路线图，未实装前不暴露配置）
observability:
  metrics:
    enabled: true         # env: PB_METRICS_ENABLED
    path: "/metrics"      # env: PB_METRICS_PATH

# 安全配置
security:
  # 可信代理网段（CIDR）。仅当直连对端在网段内才采信 X-Forwarded-For
  trusted_proxies: []
  # 取件下载令牌（时间窗 HMAC）
  download_token:
    enabled: true
    validity_seconds: 1000
  # 登录/取件失败计数锁定
  lockout:
    enabled: true
    max_attempts: 10
    window_seconds: 300
    lock_seconds: 600
  # 用户级 API Key（个人访问令牌）认证总开关（env: PB_API_TOKEN_ENABLED）。
  # false 时携带 Key 的请求一律 401（紧急停用）
  api_token:
    enabled: true
    # 单 Key 独立限流（令牌桶，进程内）：显式 0 = 不限；burst 0 = 2×QPS
    per_key_qps: 20
    per_key_burst: 40
  # 存储端点 SSRF 防护（局域网 MinIO/WebDAV 改 true）
  ssrf:
    allow_private_networks: false
  cors:
    # 跨域可信来源白名单（逗号分隔，env: PB_CORS_ALLOW_ORIGINS）。
    # 生产环境务必显式列出可信域名；留空时退化为反射 Origin（仅适合开发）。
    allow_origins: []
    # allow_credentials: false  # 是否允许携带凭证(Cookie)，生产白名单模式下建议 true
    # enable_hsts 三态：未配置 = 生产模式(server.mode=release 或 app.production)默认开、开发默认关
    # enable_hsts: false         # 自签证书等特殊拓扑的逃生开关

# 限流配置（路径感知分维度；use_redis=true 多实例共享计数）
rate_limit:
  enabled: true
  global_qps: 100
  upload_qps: 10
  download_qps: 50
  login_qps: 5
  burst: 20
  block_seconds: 60
  use_redis: false

# 通知（外部 Webhook 渠道）
notify:
  webhook_url: ""

# MCP server（AI 客户端集成；POST /api/v1/mcp，管理员 JWT 认证）
mcp:
  enabled: true             # PB_MCP_ENABLED
  # 单文件上传/下载上限（字节；默认 6MB=base64 后约 8MB，低于默认请求体上限；
  # 调大超过请求体上限时须同步调大 upload.max_file_size）。PB_MCP_MAX_FILE_SIZE
  # max_file_size: 6291456

# 内容审核（默认关闭；PB_MODERATION_ENABLED / PB_MODERATION_BLOCKED_WORDS / PB_MODERATION_BLOCK_ACTION）
moderation:
  enabled: false
  # blocked_words: ["词1", "词2"]
  block_action: reject      # reject=直接拒绝 | pending=待审进管理端队列

# 管理端运维
admin:
  log_retention_days: 90    # 审计/传输日志保留天数，0=永久

# ===== 2026-10 能力扩展（P0-P3）=====

# 邮件通知：并入上方 notify: 段（站内信创建后对登记邮箱异步补发；host 空 = 禁用）
#   notify:
#     webhook_url: ""
#     smtp:
#       host: ""              # env: PB_SMTP_HOST
#       port: 465             # 465=隐式 TLS；587/25=STARTTLS（PB_SMTP_PORT）
#       username: ""          # PB_SMTP_USERNAME
#       password: ""          # PB_SMTP_PASSWORD
#       from: ""              # 发件地址，空 = 取 username（PB_SMTP_FROM）

# 文件病毒扫描（clamd INSTREAM；moderation.enabled=true 时生效，文件侧由 ClamAV 接管）
# env: PB_MODERATION_CLAMAV_ENABLED / PB_MODERATION_CLAMAV_ADDR
# moderation:
#   clamav:
#     enabled: false
#     addr: "localhost:3310"
#     timeout_seconds: 60
#     max_scan_bytes: 536870912   # 512MB，超过跳过扫描

# OIDC 单点登录（回调地址 <base_url>/api/v1/user/oidc/callback）
# env: PB_OIDC_ENABLED / PB_OIDC_ISSUER / PB_OIDC_CLIENT_ID / PB_OIDC_CLIENT_SECRET / PB_OIDC_SCOPES
# security:
#   oidc:
#     enabled: false
#     issuer: ""              # 如 https://idp.example.com/realms/fcb
#     client_id: ""
#     client_secret: ""
#     scopes: "openid profile email"

# NAS 本地文件免上传导入（服务器白名单目录内文件直接生成提取码）
# env: PB_LOCAL_IMPORT_ENABLED / PB_LOCAL_IMPORT_ROOTS（逗号分隔）
# upload:
#   local_import:
#     enabled: false
#     roots: []               # 如 ["/volume1/share", "/mnt/nas"]

# P2P 联邦接入（M2；默认关闭。对端注册中心：github.com/pigeonbox/p2p）
# 启用后本站口令分享跨站可达：任一联邦节点录码即可解析到本站直连下载，
# 注册中心不落盘、不见明文；取件校验始终在本站完成（零跨节点信任）。
# env: PB_FEDERATION_ENABLED / PB_FEDERATION_REGISTRY_URL /
#      PB_FEDERATION_PUBLIC_URL / PB_FEDERATION_NODE_KEY_PATH /
#      PB_FEDERATION_MIN_ENTROPY
#   在线覆盖：管理后台「P2P 与联邦」分区保存后以 DB 值为准（SystemConfig
#   overlay，保存即热生效）；本文件/env 仅作首启默认（DB 无 p2p 段时生效）。
# federation:
#   enabled: false
#   registry_url: ""         # 联邦注册中心基址，如 http://p2p:12346；逗号分隔可配主备
#   public_url: ""           # 本站对外可达地址（一般与 server.base_url 一致）
#   node_key_path: "data/federation.key"  # 节点身份密钥(首次启动自动生成)
#   announce_min_entropy_bits: 40         # 口令公告熵门槛(低熵码不出站)

# ===== 部署模式（多副本拆分，2026-10-06）=====
# standalone(默认,单进程全功能) | public(公开面副本,可多实例) | admin(管理面单实例)
# public/admin 硬约束：database.driver 必须为 mysql/postgresql；Redis 必配
# （配置变更广播依赖）；federation 自动降级关闭（多副本语义未定义）。
# env 注入: PB_DEPLOY_MODE（覆盖 deployment.mode）；详见 hub 仓 docs/specs/2026-10-06-multi-replica-deployment-modes.md
# deployment:
#   mode: standalone
