name: Release
# 打 v* tag → 构建多架构镜像推 ghcr.io/pigeonbox/server 与
# ghcr.io/pigeonbox/frontend（同一版本列车：前后端分离部署,
# chart 以单一 appVersion 同时锁两个镜像）。
# server 镜像为纯后端(0.9.0 起不含前端静态资源),frontend 镜像
# (nginx 静态+API 反代)承担全部对外入口。
on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/pigeonbox/server

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Ensure GitHub Release 步骤建 Release 页（此前 read 致 403 静默跳过）
      packages: write
    steps:
      - uses: actions/checkout@v7
        with: { path: server }
      # frontend 与 server 同号打 tag(2026-10-08 列车治理 D2):优先检出同号 tag
      # 保证可复现;tag 未就绪时回退 main 并大声警告(过渡期形态,下一列车起消失)
      - name: 解析 frontend ref(同号 tag 优先)
        id: fe
        run: |
          FE_TAG="${{ github.ref_name }}"
          # 列车各仓 bump PR 合并有先后,frontend tagger 可能晚于本仓 Release 触发
          # (1.15.0 实测晚 7 分钟;0.15.12/0.15.13 两版曾因回退 main 发出上一版产物,
          # 见下方硬校验)。等待同号 tag 至多 20 分钟再回退;回退构建由版本断言兜底。
          for i in $(seq 1 40); do
            git ls-remote https://github.com/pigeonbox/frontend.git "refs/tags/${FE_TAG}" | grep -q . && break
            echo "等待 frontend 同号 tag ${FE_TAG}($i/40,30s 后重试)"; sleep 30
          done
          if git ls-remote https://github.com/pigeonbox/frontend.git "refs/tags/${FE_TAG}" | grep -q .; then
            echo "ref=${FE_TAG}" >> "$GITHUB_OUTPUT"
            echo "frontend 检出同号 tag ${FE_TAG}(可复现)"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "::warning::frontend 仓无同号 tag ${FE_TAG}(已等 20 分钟),回退 main——下方版本硬校验会拦住错版源码"
          fi
      - uses: actions/checkout@v7
        with:
          repository: pigeonbox/frontend
          path: frontend
          ref: ${{ steps.fe.outputs.ref }}
      - name: 工作区布局 + ignore 规则
        run: |
          mkdir -p ${{ github.workspace }}/ws
          mv server frontend ${{ github.workspace }}/ws/
          printf '*/.git\n**/node_modules\n*/bin\n*/data\n*/logs\ngo.work\ngo.work.sum\n' > ${{ github.workspace }}/ws/.dockerignore

      # 硬校验:frontend 源码版本必须与本 tag 同号(2026-10-12)。
      # 回退 main 构建曾把上一版前端产物当新版本发布(0.15.12/0.15.13 镜像实为
      # 0.15.11 的资产,仅 ::warning:: 无人拦截);静默发错版比失败更糟——不匹配
      # 直接红,待 frontend 同号 tag/主干 bump 合入后 re-run 本工作流即可。
      - name: 断言 frontend 源码版本与 tag 同号
        run: |
          EXPECT="${{ github.ref_name }}"
          EXPECT="${EXPECT#v}"
          GOT="$(node -p "require('${{ github.workspace }}/ws/frontend/package.json').version")"
          if [ "$GOT" != "$EXPECT" ]; then
            echo "::error::frontend 源码版本($GOT)与 tag(${{ github.ref_name }})不同号(检出 ref: ${{ steps.fe.outputs.ref || 'main(回退)' }})。拒绝构建错版镜像;请等 frontend bump 合入/同号 tag 就绪后 re-run。"
            exit 1
          fi
          echo "frontend 版本 $GOT 与 tag 同号 ✓(检出 ref: ${{ steps.fe.outputs.ref || 'main(回退)' }})"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/ws
          file: ${{ github.workspace }}/ws/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # buildx 默认 provenance 认证清单会使 GitHub Packages 页面渲染 500
          # (registry 拉取不受影响,仅 Web UI 坏),关掉保证包页可开、可见性可改
          provenance: false
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.date }}
            GOPROXY=https://proxy.golang.org,direct

      # ── frontend 镜像（k8s 前后端分离部署；tag 与 server 完全一致）──
      - id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pigeonbox/frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/ws/frontend
          file: ${{ github.workspace }}/ws/frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          provenance: false
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org

      # ── GitHub Release 自动创建（无则建，有则跳过；带自动变更notes并标 Latest）──
      - name: Ensure GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${{ github.ref_name }}" -R ${{ github.repository }} >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" -R ${{ github.repository }} --generate-notes --latest
          else
            echo "Release 已存在，跳过"
          fi
        # 不再 continue-on-error：权限修复后本步骤已被证明可用，再静默吞错只会
        # 重演 v0.12.6/v0.13.0 Release 页缺失数日无人知（2026-10-06 治理）

      # ── chart appVersion 自动对齐 ──
      # 镜像发布成功后通知 charts 仓：appVersion 对齐本 tag、chart version 自动
      # +1 并由其既有 Release Charts 工作流发版（Pages + OCI）。CHARTS_PAT 为
      # 对 charts 仓有 contents:write/dispatch 权限的 token（仓库 Secrets 配置）。
      - name: Dispatch charts appVersion sync
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.CHARTS_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/pigeonbox/charts/dispatches \
            -d '{"event_type":"component-release","client_payload":{"app_version":"${{ github.ref_name }}"}}'
        # 不再 continue-on-error：CHARTS_PAT→charts RELEASE_PAT 链路已通，断链要
        # 响（此前静默吞 403 致 chart 1.3.12/13/14 发版缺失，2026-10-06 治理）
