name: Release
# 打 v* tag → 构建多架构镜像推 ghcr.io/pigeonbox/server 与
# ghcr.io/pigeonbox/frontend（同一版本列车：前后端分离部署,
# chart 以单一 appVersion 同时锁两个镜像）。
# server 镜像为纯后端(0.9.0 起不含前端静态资源),frontend 镜像
# (nginx 静态+API 反代)承担全部对外入口。
on:
  push:
    tags: ["v*"]

concurrency:
  # 同 tag 的重跑可能与列车触发的运行并发:两边都 gh release create/upload 写
  # 同一 Release,先写者被静默覆盖。按目标版本分组串行;cancel-in-progress:false
  # ——发布中途取消比排队更糟。
  group: ${{ github.workflow }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

# 默认只读;推 ghcr + 建 Release 的作业在作业级单独开 contents/packages: write
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/pigeonbox/server

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # Ensure GitHub Release 步骤建 Release 页（此前 read 致 403 静默跳过）
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { path: server }
      # 列车 v2:编排器保证 frontend 同号 tag 先于 server tag 存在,轮询已删除;
      # tag 不在即失败——回退 main 是 0.15.12/0.15.13 幽灵产物温床,永久封死。
      - name: 解析 frontend ref(同号 tag 硬门)
        id: fe
        run: |
          FE_TAG="${{ github.ref_name }}"
          git ls-remote https://github.com/pigeonbox/frontend.git "refs/tags/${FE_TAG}" | grep -q . \
            || { echo "::error::frontend 仓无同号 tag ${FE_TAG}——发版走 hub 列车编排器(先 frontend 后 server),勿手打 server tag"; exit 1; }
          echo "ref=${FE_TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend 检出同号 tag ${FE_TAG}(可复现)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pigeonbox/frontend
          path: frontend
          ref: ${{ steps.fe.outputs.ref }}
      - name: 工作区布局 + ignore 规则
        run: |
          mkdir -p ${{ github.workspace }}/ws
          mv server frontend ${{ github.workspace }}/ws/
          printf '*/.git\n**/node_modules\n*/bin\n*/data\n*/logs\ngo.work\ngo.work.sum\n' > ${{ github.workspace }}/ws/.dockerignore

      # 硬校验:frontend 源码版本必须与本 tag 同号(2026-10-12)。
      # 回退 main 构建曾把上一版前端产物当新版本发布(0.15.12/0.15.13 镜像实为
      # 0.15.11 的资产,仅 ::warning:: 无人拦截);静默发错版比失败更糟——不匹配
      # 直接红,待 frontend 同号 tag/主干 bump 合入后 re-run 本工作流即可。
      - name: 断言 frontend 源码版本与 tag 同号
        run: |
          EXPECT="${{ github.ref_name }}"
          EXPECT="${EXPECT#v}"
          GOT="$(node -p "require('${{ github.workspace }}/ws/frontend/package.json').version")"
          if [ "$GOT" != "$EXPECT" ]; then
            echo "::error::frontend 源码版本($GOT)与 tag(${{ github.ref_name }})不同号(检出 ref: ${{ steps.fe.outputs.ref || 'main(回退)' }})。拒绝构建错版镜像;请等 frontend bump 合入/同号 tag 就绪后 re-run。"
            exit 1
          fi
          echo "frontend 版本 $GOT 与 tag 同号 ✓(检出 ref: ${{ steps.fe.outputs.ref || 'main(回退)' }})"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: btime
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ github.workspace }}/ws
          file: ${{ github.workspace }}/ws/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # buildx 默认 provenance 认证清单会使 GitHub Packages 页面渲染 500
          # (registry 拉取不受影响,仅 Web UI 坏),关掉保证包页可开、可见性可改
          provenance: false
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.btime.outputs.date }}
            GOPROXY=https://proxy.golang.org,direct

      # ── frontend 镜像（k8s 前后端分离部署；tag 与 server 完全一致）──
      - id: meta-frontend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/pigeonbox/frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ github.workspace }}/ws/frontend
          file: ${{ github.workspace }}/ws/frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          provenance: false
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org

      # ── GitHub Release 自动创建（无则建，有则跳过；带自动变更notes并标 Latest）──
      - name: Ensure GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${{ github.ref_name }}" -R ${{ github.repository }} >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" -R ${{ github.repository }} --generate-notes --latest
          else
            echo "Release 已存在，跳过"
          fi
        # 不再 continue-on-error：权限修复后本步骤已被证明可用，再静默吞错只会
        # 重演 v0.12.6/v0.13.0 Release 页缺失数日无人知（2026-10-06 治理）

      # ── 官方 CLI（cmd/pb）作为 Release 资产发布 ──
      # 此前 CLI 只在源码里，release 只产镜像 ⇒ 「官方 CLI」对用户等于不存在；
      # 而它又整体不可用（require_auth 契约必填被条件省略 ⇒ pb put 必失败），
      # 两件事互相遮掩：没人分发 ⇒ 没人用 ⇒ 没人发现坏了。
      # 这里把静态二进制发出来（linux/darwin/windows × amd64/arm64），
      # 让 CLI 修复真正到达用户手里；门禁见 cmd/pb/main_test.go（httptest 捕请求体）。
      - name: 构建官方 CLI 多平台二进制
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/ws/server"
          # 用**默认** GOPROXY（不换 goproxy.cn 等镜像）：镜像缓存可能喂陈旧模块
          # ⇒ 编出来的 CLI 与 pin 的 core 版本错配（AGENTS.md 记的「代理喂陈旧 zip」坑）。
          go mod download
          OUT="${{ github.workspace }}/cli"
          mkdir -p "$OUT"
          for spec in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64" "windows amd64"; do
            set -- $spec
            os=$1; arch=$2
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            name="pb_${os}_${arch}${ext}"
            echo "  构建 $name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "$OUT/$name" ./cmd/pb
          done
          ls -la "$OUT"
      - name: 上传 CLI 资产到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for f in "${{ github.workspace }}/cli"/pb_*; do
            [ -f "$f" ] || continue
            if gh release view "${{ github.ref_name }}" -R ${{ github.repository }} >/dev/null 2>&1; then
              gh release upload "${{ github.ref_name }}" "$f" -R ${{ github.repository }} --clobber
            fi
          done
          echo "CLI 资产已挂到 Release ${{ github.ref_name }}"

      # ── 回调 hub 列车编排器 ──
      # 镜像发布成功后唤醒 train-orchestrator advance 核对完成度。charts 对齐不再由
      # 本仓 dispatch(列车 v2 起编排器直提 Chart.yaml,双写会致 chart 版本双跳)。
      # 回调只是唤醒信号,丢失由 hub 15 分钟 sweep 兜底——故失败仅告警不阻断。
      - name: 回调 hub 列车编排器
        env:
          CB_TOKEN: ${{ secrets.PB_BOT_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $CB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/pigeonbox/pigeonbox/dispatches \
            -d '{"event_type":"train-advance","client_payload":{"component":"server","tag":"${{ github.ref_name }}"}}' \
            || echo "::warning::hub 回调失败(train-orchestrator sweep 兜底)"
