name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 显式 auto：覆盖 setup-go v7 强制的 GOTOOLCHAIN=local ⇒ 将来 go.mod 的
      # toolchain 地板再抬时，Go 能自动拉取而不是构建失败（2026-10-26 实测：
      # 浮动 go-version 拿到低于地板的 patch ⇒ 直接构建失败，门禁变噪声）。
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: server/go.sum
      - name: Build & Vet
        run: |
          go build ./...
          go vet ./...
      # gofmt 门禁（2026-10-22 补）：四个 Go 仓此前都没有 gofmt 步，
      # .golangci.yml 也没开 gofmt linter —— 格式漂移无人拦。发现即红，
      # 修法是 gofmt -w，不设豁免。
      - name: Gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Test
        run: go test -race ./...

      # 依赖漏洞门禁（govulncheck）：可达漏洞即红；修复策略=升依赖地板，不许注释绕过
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # lockfile 一致性守卫（学习上游：依赖只改一半时 CI 即失败）
      - name: Module verify
        run: |
          go mod verify
          go mod download -x 2>&1 | tail -1

      # 镜像双推 tag 计算的自测（2026-10-31）：scripts/image_tags.py 决定
      # 「镜像被推到哪个 registry、钉了哪些 tag」⇒ 写错的后果是
      # **server 镜像被推到 frontend 名下**（内容错、流水线全绿、无人察觉）。
      # ⇒ 这段逻辑必须**离线可测**，且判据有区分力（变异验证 6 条全转红）。
      - name: 镜像 tag 计算自测
        run: python3 scripts/image_tags_selftest.py

  # 文档↔代码对账（hub 门禁接线，Refs pigeonbox/pigeonbox#327 的建议修法后半）：
  # hub 仓 scripts/check-docs-consistency.sh 的 PB_* 绑定扫描源含本仓（core+server+p2p），
  # 但此前只在 hub 仓 CI 跑 ⇒ server 侧新增 PB_* 绑定而 hub 文档没跟上时，
  # 只有下趟 hub CI 才兜得住。这里把同款对账接进本仓 CI：
  #   - 门禁脚本与文档/契约真相源 = pigeonbox/pigeonbox（hub）默认分支；
  #   - server 扫描源 = **触发 ref 的本仓检出**（PR 自身代码，不是 server@main）
  #     ⇒ 本 PR 新增的绑定当场判红，这正是接线的意义；
  #   - 布局镜像 hub 仓 docs-consistency job（hub 为根，contracts/core/server/p2p 为子目录），
  #     零 env 覆盖，跑的是与 hub CI 同一条命令（--selfcheck 含七条注入自检）。
  # 耦合取舍：本仓 PR 若新增 PB_* 绑定，需 hub 侧文档先落（或同批）才绿——把
  # 「下趟 hub CI 才发现」提前到本仓 CI 当场发现。门禁脚本缺位/扫描源缺仓都判红
  # （脚本自身口径：缺仓不判绿、判红点名），本步骤不做 || true 容忍。
  docs-consistency:
    name: 文档↔代码对账（环境变量绑定，hub 门禁）
    runs-on: ubuntu-latest
    steps:
      # 顺序有讲究：hub 先检出，contracts/core/server 后嵌套检出——checkout 的
      # clean 步会清目标目录，嵌套检出放前面会被后到的 hub 检出冲掉。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: pigeonbox/pigeonbox, path: hub }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: pigeonbox/contracts, path: hub/contracts }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: pigeonbox/core, path: hub/core }
      # C2 收尾（Refs pigeonbox/pigeonbox#327）：hub 门禁射程扩 p2p（缺仓判红）⇒ p2p 一并检出
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: pigeonbox/p2p, path: hub/p2p }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { path: hub/server } # 触发 ref（PR 自身代码）
      - name: 错误码表 ⊇ errcode 常量；环境变量文档 ⊇ core/server/p2p 绑定的 PB_*
        run: bash hub/scripts/check-docs-consistency.sh --selfcheck

  docker:
    # main 推送时验证完整镜像(前端现场 npm ci 构建)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { path: server }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: pigeonbox/frontend, path: frontend }
      - name: 工作区布局 + ignore 规则
        run: |
          mkdir -p ${{ github.workspace }}/ws
          mv server frontend ${{ github.workspace }}/ws/
          printf '*/.git\n**/node_modules\n*/bin\n*/data\n*/logs\ngo.work\ngo.work.sum\n' > ${{ github.workspace }}/ws/.dockerignore
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image(no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ github.workspace }}/ws
          file: ${{ github.workspace }}/ws/server/Dockerfile
          push: false
          tags: pigeonbox-server:ci
